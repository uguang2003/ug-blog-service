name: Weekly DB Backup
on:
  schedule:
    - cron: '15 3 * * 1'   # 每周一 UTC 03:15 = 北京 11:15（错开 ug-auth 的 03:00，避免同时刻并发抢 Neon 连接）
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and gzip
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date +%F-%H%M)
          docker run --rm -e DATABASE_URL postgres:17-alpine pg_dump --no-owner --no-acl "$DATABASE_URL" | gzip > "blog-backup-$DATE.sql.gz"
          ls -lh blog-backup-*.sql.gz
          echo "FILE=$(ls blog-backup-*.sql.gz)" >> $GITHUB_ENV

      - name: Upload to Qiniu KODO (S3-compatible)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.QINIU_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.QINIU_REGION }}
        run: |
          aws s3 cp "$FILE" "s3://${{ secrets.QINIU_BUCKET }}/db-backup/blog/$FILE" \
            --endpoint-url "https://s3-${{ secrets.QINIU_REGION }}.qiniucs.com"

      - name: Cleanup backups older than 90 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.QINIU_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.QINIU_REGION }}
        run: |
          ENDPOINT="https://s3-${{ secrets.QINIU_REGION }}.qiniucs.com"
          CUTOFF=$(date -d '90 days ago' +%Y-%m-%d)
          aws s3 ls "s3://${{ secrets.QINIU_BUCKET }}/db-backup/blog/" --endpoint-url "$ENDPOINT" \
            | awk -v c="$CUTOFF" '$1 < c {print $4}' \
            | xargs -I{} -r aws s3 rm "s3://${{ secrets.QINIU_BUCKET }}/db-backup/blog/{}" --endpoint-url "$ENDPOINT" || true
