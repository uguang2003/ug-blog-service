# GitHub Actions 工作流 - 自动构建并推送 Docker 镜像到 Docker Hub
name: Docker Build and Push

# 触发条件
on:
  # 当推送到 main 分支时触发
  push:
    branches:
      - main
  # 当创建新标签时触发
  tags:
    - 'v*'
  # 允许手动触发
  workflow_dispatch:

jobs:
  # 构建和推送任务
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 第一步: 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 第二步: 设置 Docker Buildx (支持多平台构建)
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 第三步: 登录到 Docker Hub
      # 需要在 GitHub 仓库设置中添加 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 第四步: 提取元数据(标签、标记等)
      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 替换为你的 Docker Hub 用户名/镜像名
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ug-blog-service
          tags: |
            # 使用分支名作为标签
            type=ref,event=branch
            # 使用 Git 标签作为标签
            type=ref,event=tag
            # 使用 Git commit SHA 的前 7 位作为标签
            type=sha,prefix={{branch}}-
            # 为 main 分支添加 latest 标签
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 第五步: 构建并推送 Docker 镜像
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          # 推送镜像到 Docker Hub
          push: true
          # 使用上一步生成的标签
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 启用缓存加速构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 构建多平台镜像(可选,如果只需要 linux/amd64 可以删除这一行)
          platforms: linux/amd64,linux/arm64

      # 第六步: 输出镜像信息
      - name: 输出镜像信息
        run: |
          echo "镜像已成功推送到 Docker Hub!"
          echo "标签: ${{ steps.meta.outputs.tags }}"
